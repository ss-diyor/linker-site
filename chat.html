<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body class="minimal-home chat-page">
<a class="skip-link" href="#main">Asosiy kontentga o‘tish</a>
<div class="minimal-page"><button class="theme-toggle" type="button" aria-label="Light themega o'tish" aria-pressed="false"><span class="theme-toggle-label">light</span></button>
<main id="main" class="chat-main">

</main></div>
