<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="shunchaki qiziqishdan." />
  <meta name="theme-color" content="#0a0b2c" />
  <meta property="og:title" content="Diyorbek Sultanov" />
  <meta property="og:description" content="shunchaki qiziqishdan." />
  <meta property="og:url" content="https://sultanov.space" />
  <meta property="og:type" content="website" />
  <title>diyor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg:        #05061a;
      --text:      #ffffff;
      --muted:     #52527a;
      --link:      #7070aa;
      --link-hover:#ffffff;
      --border:    #0c0d28;
    }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    a { text-decoration: none; color: inherit; }

    /* ─── Container ─── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 640px;
      margin: 0 auto;
      padding: 5rem 2rem 4rem;
    }

    /* ─── Hero ─── */
    .hero { flex: 0 0 auto; }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
    }

    .hero p {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ─── Nav (vertical stack, t3.gg minimal) ─── */
    nav {
      flex: 1;
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    nav a {
      font-size: 0.95rem;
      color: var(--link);
      transition: color 80ms ease;
      width: fit-content;
    }

    nav a:hover { color: var(--link-hover); }

    /* ─── Footer ─── */
    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .socials {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    .socials a {
      font-size: 0.75rem;
      color: #2e2e52;
      transition: color 80ms ease;
    }

    .socials a:hover { color: var(--muted); }

    /* ─── Animations ─── */
    .fade-in {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    .fade-in.delay { transition-delay: 0.1s; }
    .fade-in.delay2 { transition-delay: 0.2s; }
    .visible { opacity: 1; transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 2rem; }
      .page { padding: 4rem 1.5rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="hero fade-in">
      <h1>diyor</h1>
      <p>shunchaki qiziqishdan</p>
    </div>

    <nav aria-label="Links" class="fade-in delay">
      <a href="https://www.linkedin.com/in/diyorbek-sultanov" target="_blank" rel="noreferrer">linkedin</a>
      <a href="https://t.me/diyorsultanov" target="_blank" rel="noreferrer">telegram</a>
      <a href="https://github.com/ss-diyor" target="_blank" rel="noreferrer">github</a>
      <a href="https://boxd.it/ka3IV" target="_blank" rel="noreferrer">letterboxd</a>
      <a href="https://x.com/ozbekfarzandi" target="_blank" rel="noreferrer">x</a>
      <a href="https://open.spotify.com/user/313bom6hthxk5sgbo5mr3lxzrkzu?si=NNFFiMSbSjqIdc9eWgygw" target="_blank" rel="noreferrer">spotify</a>
      <a href="/projects.html">loyihalar</a>
    </nav>

    <footer class="fade-in delay2">
      <div class="socials">
        <a href="https://github.com/ss-diyor" target="_blank" rel="noreferrer">gh</a>
        <a href="https://t.me/diyorsultanov" target="_blank" rel="noreferrer">tg</a>
        <a href="mailto:diyorbeksultanov.ss@gmail.com">mail</a>
        <a href="https://www.linkedin.com/in/diyorbek-sultanov" target="_blank" rel="noreferrer">li</a>
        <a href="https://boxd.it/ka3IV" target="_blank" rel="noreferrer">lboxd</a>
        <a href="https://x.com/ozbekfarzandi" target="_blank" rel="noreferrer">x</a>
        <a href="https://open.spotify.com/user/313bom6hthxk5sgbo5mr3lxzrkzu?si=NNFFiMSbSjqIdc9eWgygw" target="_blank" rel="noreferrer">sptfy</a>
      </div>
    </footer>

  </div>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('visible');
      });
    }, { threshold: 0.05 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
