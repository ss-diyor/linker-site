<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05061a"><title>Admin — Diyorbek Sultanov</title>
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css">
<script>
    (() => {
      const savedTheme = localStorage.getItem('theme');
      document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
    })();
  </script>
</head>
<body class="minimal-home admin-page">
<a class="skip-link" href="#main">Asosiy kontentga o‘tish</a>
<div class="minimal-page">
    <button class="theme-toggle" type="button" aria-label="Light themega o'tish" aria-pressed="false"><span class="theme-toggle-label">light</span></button><main id="main" class="admin-main">
<header class="minimal-hero admin-header"><a class="minimal-back" href="/">bosh sahifa</a><h1>Admin</h1><p>now content manager</p></header>
<section id="login-view" class="admin-panel" aria-labelledby="login-title"><h2 id="login-title">Kirish</h2><p class="admin-note">Faqat admin account bilan kirish mumkin.</p><form id="login-form"><label>Email<input type="email" id="login-email" required autocomplete="email"></label><label>Parol<input type="password" id="login-password" required autocomplete="current-password"></label><button class="admin-submit" type="submit">kirish <span aria-hidden="true">↗</span></button><p id="login-error" class="admin-error" role="alert" hidden></p></form></section>
<section id="dashboard-view" hidden>
<div class="admin-toolbar"><p id="admin-user" class="admin-note"></p><button id="logout-button" class="admin-quiet-button" type="button">chiqish</button></div>
<section class="admin-panel"><h2>Now sozlamalari</h2><form id="settings-form" class="admin-form"><label>Focus title<input id="focus-title" required></label><label>Focus subtitle<input id="focus-subtitle" required></label><button class="admin-submit" type="submit">saqlash</button></form></section>
<section class="admin-panel"><div class="admin-section-heading"><h2>About sahifasi</h2></div><form id="about-form" class="admin-form"><label>Asosiy bio<textarea id="about-bio-input" rows="4" required></textarea></label><label>Ta’lim va asosiy faktlar<textarea id="about-facts-input" rows="5" placeholder="universitet | Chirchiq davlat pedagogika universiteti&#10;ta’lim yo‘nalishi | Xorijiy til va adabiyoti: ingliz tili"></textarea></label><label>Maqsad va yo‘nalish<textarea id="about-goal-input" rows="3"></textarea></label><label>Hard skillar<textarea id="about-hard-input" rows="3" placeholder="JavaScript&#10;Graphic design&#10;AI tools"></textarea></label><label>Soft skillar<textarea id="about-soft-input" rows="3" placeholder="Communication&#10;Teamwork&#10;Event organization"></textarea></label><div><label>Tillar</label><div id="about-languages-editor"></div><button class="admin-quiet-button" type="button" id="add-language">+ til qo‘shish</button></div><label>Qiziqishlar<textarea id="about-interests-input" rows="3" placeholder="Kitoblar&#10>Kino&#10>Sport"></textarea></label><label>Qo‘shimcha matn<textarea id="about-tech-input" rows="3"></textarea></label><label>Shaxsiy quote<textarea id="about-quote-input" rows="3"></textarea></label><div class="admin-form-actions"><button class="admin-submit" type="submit">about’ni saqlash</button></div></form></section>
<section class="admin-panel"><div class="admin-section-heading"><h2>Loyihalar</h2><button class="admin-quiet-button" type="button" data-add="project">+ yangi</button></div><form id="project-form" class="admin-form" hidden><input type="hidden" id="project-id"><label>Nomi<input id="project-title" required></label><label>Tavsif<textarea id="project-description" rows="4" required></textarea></label><label>Havola<input id="project-url" type="url"></label><label>Havola nomi<input id="project-link-label" placeholder="ochish ↗"></label><label>Tartib raqami<input id="project-position" type="number" min="0" value="0"></label><label class="admin-checkbox"><input id="project-published" type="checkbox" checked> sahifada ko‘rsatish</label><div class="admin-form-actions"><button class="admin-submit" type="submit">saqlash</button><button class="admin-quiet-button" type="button" data-cancel="project">bekor qilish</button></div></form><div id="projects-admin-list" class="admin-list"></div></section>
<section class="admin-panel"><div class="admin-section-heading"><h2>Nimadir</h2><button class="admin-quiet-button" type="button" data-add="update">+ yangi</button></div>
<form id="update-form" class="admin-form" hidden><input type="hidden" id="update-id"><label>Sarlavha<input id="update-title" required></label><label>Matn<textarea id="update-content" rows="4" required></textarea></label><label>Havola<input id="update-url" type="url"></label><label>Manba<input id="update-source" placeholder="Telegram, YouTube, shaxsiy fikr..."></label><label>Sana<input id="update-date" type="date" required></label><label>Tartib raqami<input id="update-position" type="number" min="0" value="0"></label><label class="admin-checkbox"><input id="update-published" type="checkbox" checked> bosh sahifada ko‘rsatish</label><div class="admin-form-actions"><button class="admin-submit" type="submit">saqlash</button><button class="admin-quiet-button" type="button" data-cancel="update">bekor qilish</button></div></form><div id="updates-admin-list" class="admin-list"></div></section>
<section class="admin-panel"><div class="admin-section-heading"><h2>Kitoblar</h2><button class="admin-quiet-button" type="button" data-add="book">+ yangi</button></div><form id="book-form" class="admin-form" hidden><input type="hidden" id="book-id"><label>Nomi<input id="book-title" required></label><label>Muallif<input id="book-author" required></label><label>Yil<input id="book-year" type="number" min="0"></label><label>Holati<select id="book-status"><option value="reading">o‘qiyapman</option><option value="paused">pauza</option><option value="finished">tugatdim</option></select></label><label>Havola<input id="book-url" type="url"></label><label>Izoh<textarea id="book-note" rows="3"></textarea></label><div class="admin-form-actions"><button class="admin-submit" type="submit">saqlash</button><button class="admin-quiet-button" type="button" data-cancel="book">bekor qilish</button></div></form><div id="books-admin-list" class="admin-list"></div></section>
<section class="admin-panel"><div class="admin-section-heading"><h2>Media diary</h2><button class="admin-quiet-button" type="button" data-add="media">+ yangi</button></div><form id="media-form" class="admin-form" hidden><input type="hidden" id="media-id"><label>Nomi<input id="media-title" required></label><label>Turi<select id="media-type"><option value="movie">film</option><option value="series">serial</option><option value="animation">multfilm</option><option value="documentary">documentary</option><option value="anime">anime</option><option value="other">boshqa</option></select></label><label>Status<select id="media-status"><option value="watched">ko‘rilgan</option><option value="watching">hozir ko‘rilmoqda</option><option value="watchlist">watchlist</option></select></label><label>Yil<input id="media-year" type="number" min="0"></label><label>Rating<input id="media-rating" type="number" min="0" max="10" step="0.5"></label><label>Havola<input id="media-url" type="url"></label><label>Izoh<textarea id="media-note" rows="3"></textarea></label><div class="admin-form-actions"><button class="admin-submit" type="submit">saqlash</button><button class="admin-quiet-button" type="button" data-cancel="media">bekor qilish</button></div></form><div id="media-admin-list" class="admin-list"></div></section>
<p id="admin-status" class="admin-note" role="status"></p>
</section></main><footer class="minimal-footer"><span>© 2026/2027 Diyorbek Sultanov</span></footer></div>
<script src="/script.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/admin.js"></script>
</body></html>
