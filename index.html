  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg:        #05061a;
      --text:      #ffffff;
      --muted:     #52527a;
      --link:      #7070aa;
      --link-hover:#ffffff;
      --border:    #0c0d28;
    }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist Mono', ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    a { text-decoration: none; color: inherit; }

    /* ─── Container ─── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 640px;
      margin: 0 auto;
      padding: 5rem 2rem 4rem;
    }

    /* ─── Hero ─── */
    .hero { flex: 0 0 auto; }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
    }

    .hero p {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ─── Now line ─── */
    .now {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .now-label {
      color: #3a3a5c;
    }

    /* ─── Scroll Nav with loupe ─── */
    .scroll-nav {
      flex: 1;
      margin-top: 3rem;
      position: relative;
      height: 230px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%, black 26%, black 74%, transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%, black 26%, black 74%, transparent 100%
      );
    }

    .scroll-track {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
    }

    .scroll-track a {
      display: inline-block;
      padding: 0.5rem 0;
      font-size: 0.95rem;
      color: var(--link);
      transform-origin: left center;
      will-change: transform, opacity;
    }

    .scroll-track a:hover {
      color: var(--link-hover) !important;
      opacity: 1 !important;
    }

    /* grab cursor */
    .scroll-nav { cursor: grab; touch-action: none; user-select: none; }
    .scroll-nav.dragging { cursor: grabbing; }

    /* Mobile: centre the links */
    @media (max-width: 640px) {
      .scroll-track { align-items: center; }
      .scroll-track a { transform-origin: center center; }
    }

    /* ─── Footer ─── */
    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .socials {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    .socials a {
      font-size: 0.75rem;
      color: #2e2e52;
      transition: color 80ms ease;
    }

    .socials a:hover { color: var(--muted); }

    /* ─── Animations ─── */
    .fade-in {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    .fade-in.delay { transition-delay: 0.1s; }
    .fade-in.delay2 { transition-delay: 0.2s; }
    .visible { opacity: 1; transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 2rem; }
      .page { padding: 4rem 1.5rem 3rem; }
    }
  </style>

<body>

  <script>
    // Fade-in observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('visible');
      });
    }, { threshold: 0.05 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // ── Scroll nav: endless loop + loupe + drag/swipe + momentum ──
    (function () {
      const nav   = document.querySelector('.scroll-nav');
      const track = document.getElementById('scrollTrack');
      if (!nav || !track) return;

      const AUTO_SPD = 0.5;
      const FRICTION = 0.92;

      let oneSetH  = 0;
      let y        = 0;
      let velocity = 0;
      let isDragging = false;
      let dragStartY = 0;
      let lastDragY  = 0;
      let lastDragT  = 0;
      let rafId      = null;

      function smoothstep(t) {
        t = Math.max(0, Math.min(1, t));
        return t * t * (3 - 2 * t);
      }

      function wrapY(v) {
        if (oneSetH <= 0) return v;
        return ((v - oneSetH) % oneSetH + oneSetH) % oneSetH + oneSetH;
      }

      function init() {
        const origItems = [...track.querySelectorAll('a')];
        oneSetH = origItems.reduce((sum, a) => sum + a.offsetHeight, 0);
        if (oneSetH <= 0) return;

        const navH   = nav.offsetHeight;
        const copies = Math.max(4, Math.ceil((navH * 4) / oneSetH));
        for (let i = 0; i < copies; i++) {
          origItems.forEach(a => track.appendChild(a.cloneNode(true)));
        }

        y = oneSetH;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(tick);
      }

      function onDragStart(clientY) {
        isDragging = true;
        velocity   = 0;
        dragStartY = clientY;
        lastDragY  = clientY;
        lastDragT  = performance.now();
        nav.classList.add('dragging');
      }

      function onDragMove(clientY) {
        if (!isDragging) return;
        const now   = performance.now();
        const dt    = Math.max(1, now - lastDragT);
        const delta = lastDragY - clientY;
        velocity    = (delta / dt) * (1000 / 60);
        y           = wrapY(y + delta);
        lastDragY   = clientY;
        lastDragT   = now;
      }

      function onDragEnd() {
        isDragging = false;
        nav.classList.remove('dragging');
      }

      nav.addEventListener('mousedown', e => { e.preventDefault(); onDragStart(e.clientY); });
      window.addEventListener('mousemove', e => { if (isDragging) onDragMove(e.clientY); });
      window.addEventListener('mouseup',   () => onDragEnd());

      nav.addEventListener('touchstart', e => onDragStart(e.touches[0].clientY), { passive: true });
      nav.addEventListener('touchmove',  e => { onDragMove(e.touches[0].clientY); }, { passive: true });
      nav.addEventListener('touchend',   () => onDragEnd());

      nav.addEventListener('click', e => {
        const a = e.target.closest('a');
        if (!a) return;
        const dist = Math.abs((dragStartY || 0) - lastDragY);
        if (dist > 6) e.preventDefault();
      });

      function tick() {
        if (isDragging) {
        } else if (Math.abs(velocity) > 0.08) {
          y        = wrapY(y + velocity);
          velocity *= FRICTION;
        } else {
          velocity = 0;
          y        = wrapY(y + AUTO_SPD);
        }

        track.style.transform = `translateY(-${y}px)`;

        const navRect = nav.getBoundingClientRect();
        const centerY = navRect.top + navRect.height / 2;
        const halfH   = navRect.height * 0.52;

        track.querySelectorAll('a').forEach(a => {
          const r    = a.getBoundingClientRect();
          const dist = Math.abs(r.top + r.height / 2 - centerY);
          const t    = smoothstep(Math.max(0, 1 - dist / halfH));
          a.style.transform = `scale(${(0.72 + t * 1.08).toFixed(3)})`;
          a.style.opacity   = (0.18 + t * 0.82).toFixed(3);
        });

        rafId = requestAnimationFrame(tick);
      }

      (document.fonts ? document.fonts.ready : Promise.resolve()).then(init);
    })();
  </script>
