<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Diyorbek Sultanov hozir nimalar bilan shug‘ullanayotgani, o‘qiyotgani va ko‘rayotgani haqida."><meta name="theme-color" content="#05061a"><meta name="author" content="Diyorbek Sultanov">
  <link rel="canonical" href="https://sultanov.space/now">
  <meta property="og:title" content="Hozir — Diyorbek Sultanov"><meta property="og:description" content="Diyorbek Sultanovning hozirgi qiziqishlari, kitoblari va media diary’si."><meta property="og:url" content="https://sultanov.space/now"><meta property="og:type" content="website"><meta property="og:image" content="https://sultanov.space/og.png"><meta name="twitter:card" content="summary_large_image">
  <title>Hozir — Diyorbek Sultanov</title>
  <link rel="icon" href="/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
  <script>
    (() => {
      const savedTheme = localStorage.getItem('theme');
      document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
    })();
  </script>
</head>
<body class="minimal-home minimal-now-page">
  <a class="skip-link" href="#main">Asosiy kontentga o‘tish</a>
  <div class="minimal-page">
    <button class="theme-toggle" type="button" aria-label="Light themega o'tish" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">☼</span><span class="theme-toggle-label">light</span></button>
    <main id="main" class="minimal-main">
      <header class="minimal-hero reveal visible"><a class="minimal-back" href="/" aria-label="Bosh sahifaga qaytish">bosh sahifa</a><h1>Hozir</h1><p>what I’m into lately</p></header>

      <section class="now-focus reveal visible" aria-labelledby="focus-title">
        <p class="section-label" id="focus-title">currently focused on</p>
        <p class="now-focus-text">Xorijiy til va adabiyoti: ingliz tili<br><span>web development · AI · design</span></p>
      </section>

      <section class="now-section reveal visible" aria-labelledby="reading-title">
        <div class="now-section-heading"><h2 id="reading-title">Kitoblar</h2><span aria-hidden="true">books</span></div>
        <div class="now-tabs" role="tablist" aria-label="Kitoblar holati">
          <button class="now-tab is-active" id="book-tab-finished" role="tab" aria-selected="true" aria-controls="book-panel-finished" data-tab-group="books" data-status="finished">O‘qidim</button>
          <button class="now-tab" id="book-tab-reading" role="tab" aria-selected="false" aria-controls="book-panel-reading" data-tab-group="books" data-status="reading" tabindex="-1">O‘qiyapman</button>
          <button class="now-tab" id="book-tab-paused" role="tab" aria-selected="false" aria-controls="book-panel-paused" data-tab-group="books" data-status="paused" tabindex="-1">O‘qimoqchiman</button>
        </div>
        <div class="now-panel is-active" id="book-panel-finished" data-tab-group="books" role="tabpanel" aria-labelledby="book-tab-finished" tabindex="0"></div>
        <div class="now-panel" id="book-panel-reading" data-tab-group="books" role="tabpanel" aria-labelledby="book-tab-reading" tabindex="0" hidden></div>
        <div class="now-panel" id="book-panel-paused" data-tab-group="books" role="tabpanel" aria-labelledby="book-tab-paused" tabindex="0" hidden></div>
      </section>

      <section class="now-section reveal visible" aria-labelledby="media-title">
        <div class="now-section-heading"><h2 id="media-title">Kino kundalik</h2><span aria-hidden="true">films · series · more</span></div>
        <div class="now-tabs" role="tablist" aria-label="Kino kundalik holati">
          <button class="now-tab is-active" id="tab-watched" role="tab" aria-selected="true" aria-controls="panel-watched" data-tab-group="media" data-status="watched">Ko‘rganlarim</button>
          <button class="now-tab" id="tab-watching" role="tab" aria-selected="false" aria-controls="panel-watching" data-tab-group="media" data-status="watching" tabindex="-1">Hozir ko‘ryapman</button>
          <button class="now-tab" id="tab-watchlist" role="tab" aria-selected="false" aria-controls="panel-watchlist" data-tab-group="media" data-status="watchlist" tabindex="-1">Ko‘rmoqchiman</button>
        </div>
        <div class="now-panel is-active" id="panel-watched" data-tab-group="media" role="tabpanel" aria-labelledby="tab-watched" tabindex="0"></div>
        <div class="now-panel" id="panel-watching" data-tab-group="media" role="tabpanel" aria-labelledby="tab-watching" tabindex="0" hidden></div>
        <div class="now-panel" id="panel-watchlist" data-tab-group="media" role="tabpanel" aria-labelledby="tab-watchlist" tabindex="0" hidden></div>
      </section>
    </main>
    <footer class="minimal-footer"><span>© 2026/2027 Diyorbek Sultanov</span></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/data/now.js"></script><script src="/script.js"></script><script src="/now-db.js"></script>
</body>
</html>
